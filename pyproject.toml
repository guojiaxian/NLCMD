[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlcmd"
version = "1.0.0"
description = "nlcmd - 自然语言转 Shell 命令的终端助手（Natural Language Command）"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "nlcmd contributors" }]
keywords = ["cli", "llm", "shell", "natural-language", "linux", "terminal", "ai"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "prompt_toolkit>=3.0,<4",
    "rich>=12,<14",
    "httpx>=0.23,<0.26",
    "tomli>=1.1,<3; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/<your-org>/nlcmd"
Repository = "https://github.com/<your-org>/nlcmd"
Documentation = "https://github.com/<your-org>/nlcmd#readme"

[project.scripts]
nlcmd = "nlcmd.cli:main"
nlc = "nlcmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
